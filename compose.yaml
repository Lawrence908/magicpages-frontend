networks:
  web:
    external: true
    name: homelab-web

services:
  magicpages-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: magicpages-frontend
    restart: unless-stopped
    networks:
      - web
    ports:
      - "8101:80"
    environment:
      - NODE_ENV=production
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      # Use CMD-SHELL so wget can exit non‑zero on non-2xx responses
      test: ["CMD-SHELL", "wget -qO- http://localhost/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
